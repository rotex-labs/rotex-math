[package]
name = "rotex-math"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Mathematical utilities for rotexengine development"
repository = "https://github.com/rotexengine/rotex-math.git"

[dependencies]
glam = "0.33.1"
ultraviolet = { version = "0.10.0", optional = true }
wide = { version = "1.5.0", optional = true }

[features]
wide-simd = ["ultraviolet", "wide"]

[dev-dependencies]
proptest = "1.11"
criterion = { version = "0.8", features = ["cargo_bench_support"] }
rand = "0.10"

[[bench]]
name = "frustum_cull"
harness = false
