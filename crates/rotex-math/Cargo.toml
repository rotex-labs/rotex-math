[package]
name = "rotex-math"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Mathematical utilities for rotexengine development"
documentation = "https://docs.rs/rotex-math"
repository = "https://github.com/rotex-labs/rotex-math"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
glam = "0.33.12"
wide = { version = "1.7.1", optional = true }

[features]
wide-simd = ["wide"]

[dev-dependencies]
proptest = "1.11"
criterion = { version = "0.8", features = ["cargo_bench_support"] }
rand = "0.10"

[[bench]]
name = "frustum_cull"
harness = false
